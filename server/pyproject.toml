[project]
name = "garment-dart-server"
version = "0.1.0"
description = "Local solver server: runs intrinsic-dart's single-cone dart code for the web editor."
requires-python = ">=3.13"
# Only what intrinsic-dart's solver core imports (triangulation, FEM Steklov, cone_dart), at the versions in
# intrinsic-dart/uv.lock. The demo's GUI dependencies (PySide6, pyqtgraph, ...) are not needed.
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "triangle==20250106",
]

[tool.uv]
package = false
